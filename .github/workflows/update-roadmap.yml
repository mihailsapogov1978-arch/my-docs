name: 🔄 Автообновление дорожной карты

on:
  schedule:
    - cron: '0 */6 * * *'
  
  issues:
    types: [opened, closed, labeled, unlabeled, assigned, unassigned]
  
  workflow_dispatch:
    inputs:
      reason:
        description: 'Причина обновления'
        required: false
        default: 'Ручное обновление'

jobs:
  update-roadmap:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyGitHub Jinja2
      
      - name: Generate roadmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/generate_roadmap.py
      
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add docs/roadmap.md
          git status
          
          if git diff --cached --exit-code --quiet; then
            echo "ℹ️ Нет изменений для коммита"
            exit 0
          fi
          
          git commit -m "🔄 Автообновление дорожной карты"
          git push