site_name: Документация ЦБ ОГВ ЯНАО
site_url: https://mihailsapogov1978-arch.github.io/my-docs/
site_description: Документация ЦБ ОГВ ЯНАО
dev_addr: 0.0.0.0:8000
use_directory_urls: true

theme:
  name: material
  language: ru
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - content.tooltips
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Переключиться на тёмный режим
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Переключиться на светлый режим

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js
  - javascripts/contracts.js
  - javascripts/project-log.js
  - javascripts/roadmap-sync.js

markdown_extensions:
  - md_in_html
  - attr_list
  - admonition
  - tables
  - toc:
      permalink: true
      title: Оглавление
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: ru
      separator: '[\s\-–—_]+'
  # - git-revision-date-localized:
  #     timezone: Europe/Moscow
  #     type: date
  #     locale: ru
  #     fallback_to_build_date: False

validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: ignore
  links:
    not_found: warn
    anchors: info
    absolute_links: ignore
    unrecognized_links: warn

nav:
  - Контракты 2019–2026: Contracts/svod_gk.md
  - Карта мероприятий: projects_2026/roadmap.md
  - Статистика по заявкам: calls/zayavky.md
